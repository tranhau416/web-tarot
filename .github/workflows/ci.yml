name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tarot_user
          POSTGRES_PASSWORD: tarot_pass
          POSTGRES_DB: tarot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarot_user -d tarot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://tarot_user:tarot_pass@localhost:5432/tarot_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nginx config
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.25-alpine nginx -t

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 240

      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost/health
          curl -fsS -o /dev/null http://localhost/
          curl -fsS -o /dev/null -w "%{content_type}\n" http://localhost/cards/00-the-fool.webp | grep -q image/webp
          test "$(curl -fsS http://localhost/api/v1/cards | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 78
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost/api/v1/draw/ai-stream \
            -H 'Content-Type: application/json' -d '{"spread_type":"single"}')
          test "$code" = 403
          curl -fsS -X POST http://localhost/api/v1/draw \
            -H 'Content-Type: application/json' -H 'X-Adult-Confirmed: true' \
            -d '{"spread_type":"celtic_cross"}' \
            | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["interpretation"]["cards"]) == 10'
          curl -fsS -N -X POST http://localhost/api/v1/draw/ai-stream \
            -H 'Content-Type: application/json' -H 'X-Adult-Confirmed: true' \
            -d '{"spread_type":"three_card"}' | tail -c 300 | grep -q '"type":"done"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop stack
        if: always()
        run: docker compose down -v
